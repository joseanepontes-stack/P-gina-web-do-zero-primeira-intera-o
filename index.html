
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #183c63;
            color: #FFFFFF;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        main {
            background-color: #FFFFFF;
            color: #183c63;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;           
        }
        article {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        img {
            width: 80px;
            height: 80px;
        }
        .artigo-autor {
            font-weight: bold;
        }
        button {
            cursor: pointer;
            padding: 6px 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu Blog Tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação.</p>
    </header>
    <main>
        <article>         
            <img src="imagem-blog.png" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital e brilhante">
            <div>           
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Gabriel Ribas</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
                <button>❤️ <span>0</span></button>
                <button>😎 <span>0</span></button>
            </div>
        </article>
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        function botaoClicado(event) {
            const botao = event.currentTarget;
            let texto = botao.querySelector("span");
            texto.textContent = Number(texto.textContent) + 1;
        }

        botoes.forEach(function(botao) {
            botao.addEventListener("click", botaoClicado);
        });
    </script>
</body>
</html>
